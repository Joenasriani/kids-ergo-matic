<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERGO-MATIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap');

        :root {
            --primary: rgb(59, 130, 246);
            --bg-blue: rgb(224, 242, 254);
            --outer-margin-bg: rgb(191, 219, 254);
            --btn-deep: rgba(255, 255, 255, 0.2); 
            --btn-shadow: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: var(--outer-margin-bg);
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
            height: 100dvh;
            margin: 0;
            padding: 2vmin;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-shell {
            width: 100%;
            height: 100%;
            background: var(--bg-blue);
            border-radius: 4vmin;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4vmin 10vmin -2vmin rgba(0,0,0,0.25);
            border: 0.8vmin solid white;
        }

        header {
            flex-shrink: 0;
            height: 15vh;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5vmin;
            border-bottom: 0.5vmin solid var(--outer-margin-bg);
            z-index: 10;
        }

        main.game-arena {
            flex: 1;
            position: relative;
            background: radial-gradient(rgb(191,219,254) 0.3vmin, transparent 0.3vmin);
            background-size: 6vmin 6vmin;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 2vmin;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 3vmin;
            width: 100%;
            max-width: 110vmin;
            max-height: 100%;
            align-content: center;
            justify-items: center;
        }

        .tile {
            width: 100%;
            aspect-ratio: 1;
            max-width: 12vh;
            max-height: 12vh;
            border-radius: 3vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 0.6vmin solid rgb(186, 230, 253);
            box-shadow: 0 1vmin 0 rgb(186, 230, 253);
            position: relative;
            font-size: 7vmin;
            transition: transform 0.2s;
        }

        .tile-active {
            border-color: var(--primary);
            box-shadow: 0 1vmin 0 rgb(37, 99, 235);
            transform: scale(1.1);
        }

        .tile-finish-glow {
            background: var(--primary) !important;
            border-color: white !important;
            overflow: hidden;
            z-index: 1;
        }

        .hero-bot {
            width: 8vh;
            height: 8vh;
            position: absolute;
            z-index: 100;
            font-size: 7vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            filter: drop-shadow(0 1vmin 1.5vmin rgba(0,0,0,0.4));
            will-change: left, top;
        }

        .jump-animation { animation: robot-hop 0.5s ease; }
        @keyframes robot-hop {
            0%, 100% { transform: translateY(0); filter: drop-shadow(0 1vmin 1.5vmin rgba(0,0,0,0.4)); }
            50% { transform: translateY(-12vh) scale(1.4); filter: drop-shadow(0 5vmin 3vmin rgba(0,0,0,0.2)); }
        }

        .control-panel {
            flex-shrink: 0;
            height: 25vh;
            background: rgba(255, 255, 255, 0.95);
            border-top: 0.6vmin solid var(--outer-margin-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .canvas-dice-area {
            height: 80%;
            width: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quest-card-modal {
            background: white;
