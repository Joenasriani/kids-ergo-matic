<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERGO-MATIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap');

        :root {
            --primary: rgb(59, 130, 246);
            --bg-blue: rgb(224, 242, 254);
            --outer-margin-bg: rgb(191, 219, 254);
            --btn-deep: rgba(255, 255, 255, 0.2); 
            --btn-shadow: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: var(--outer-margin-bg);
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
            height: 100dvh;
            margin: 0;
            padding: 2vmin;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-shell {
            width: 100%;
            height: 100%;
            background: var(--bg-blue);
            border-radius: 4vmin;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4vmin 10vmin -2vmin rgba(0,0,0,0.25);
            border: 0.8vmin solid white;
        }

        header {
            flex-shrink: 0;
            height: 15vh;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5vmin;
            border-bottom: 0.5vmin solid var(--outer-margin-bg);
            z-index: 10;
        }

        main.game-arena {
            flex: 1;
            position: relative;
            background: radial-gradient(rgb(191,219,254) 0.3vmin, transparent 0.3vmin);
            background-size: 6vmin 6vmin;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 2vmin;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 3vmin;
            width: 100%;
            max-width: 110vmin;
            max-height: 100%;
            align-content: center;
            justify-items: center;
        }

        .tile {
            width: 100%;
            aspect-ratio: 1;
            max-width: 12vh;
            max-height: 12vh;
            border-radius: 3vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 0.6vmin solid rgb(186, 230, 253);
            box-shadow: 0 1vmin 0 rgb(186, 230, 253);
            position: relative;
            font-size: 7vmin;
            transition: transform 0.2s;
        }

        .tile-active {
            border-color: var(--primary);
            box-shadow: 0 1vmin 0 rgb(37, 99, 235);
            transform: scale(1.1);
        }

        .hero-bot {
            width: 8vh;
            height: 8vh;
            position: absolute;
            z-index: 100;
            font-size: 7vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            filter: drop-shadow(0 1vmin 1.5vmin rgba(0,0,0,0.4));
            will-change: left, top;
        }

        .jump-animation { animation: robot-hop 0.5s ease; }
        @keyframes robot-hop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12vh) scale(1.3); }
        }

        .control-panel {
            flex-shrink: 0;
            height: 25vh;
            background: white;
            border-top: 0.6vmin solid var(--outer-margin-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .canvas-dice-area {
            height: 80%;
            width: 100%;
            cursor: pointer;
        }

        .quest-card-modal {
            background: white;
            border-radius: 6vmin;
            width: 90%;
            max-width: 95vmin;
            padding: 6vmin;
            box-shadow: 0 6vmin 12vmin -2vmin rgba(0,0,0,0.6);
            text-align: center;
            transform: scale(0.5);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .active-modal { transform: scale(1); opacity: 1; }

        .overlay-screen {
            position: absolute;
            inset: 0;
            background: var(--primary);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            color: white;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <div id="intro-layer" class="overlay-screen">
            <h1 class="text-[12vh] font-bold uppercase">ERGO-MATIC</h1>
            <button onclick="startGame()" class="bg-white text-blue-500 px-[10vh] py-[3vh] rounded-[4vmin] text-[6vh] font-bold shadow-2xl">START</button>
        </div>

        <header>
            <div class="flex items-center gap-[4vmin]">
                <div class="flex items-center gap-[2vmin] bg-blue-50 px-[4vmin] py-[1vh] rounded-[3vmin] border-[0.4vmin] border-blue-100">
                    <span class="text-[5vh]">💎</span>
                    <span id="score-val" class="text-[5vh] font-bold text-blue-600">0</span>
                </div>
                <div id="heart-display" class="text-[5vh]">❤️❤️</div>
            </div>
            <div onclick="location.reload()" class="ui-icon">🏠</div>
        </header>

        <main class="game-arena" id="game-container">
            <div id="grid-path" class="board-grid"></div>
            <div id="robot-hero" class="hero-bot">🤖</div>
        </main>

        <footer class="control-panel" onclick="rollAction()">
            <div id="3d-dice-container" class="canvas-dice-area"></div>
            <p class="font-bold text-blue-500 uppercase tracking-widest">TAP TO ROLL</p>
        </footer>

        <div id="modal-overlay" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden z-[6000] flex items-center justify-center p-[5vmin]">
            <div id="quest-box" class="quest-card-modal">
                <div id="modal-content-area"></div>
            </div>
        </div>
    </div>

    <script>
        const ERGO_BANK = [
            { icon: '🏠', quest: 'Welcome', q: 'What is Ergonomics?', a: ['Plant growth', 'Fitting task to person', 'Racing cars'], c: 1 },
            { icon: '💻', quest: 'Monitor', q: 'Where should the screen top be?', a: ['Eye level', 'Below chin', 'Ceiling'], c: 0 },
            { icon: '⌨️', quest: 'Keyboard', q: 'Wrist position while typing?', a: ['Bent up', 'Bent down', 'Straight'], c: 2 },
            { icon: '📏', quest: 'Distance', q: 'How far should your monitor be?', a: ['Arm length', 'Very close', 'Across room'], c: 0 },
            { icon: '📐', quest: 'Elbows', q: 'Angle for elbows while typing?', a: ['Straight', '90 degrees (L)', 'Bent back'], c: 1 },
            { icon: '🎒', quest: 'Backpack', q: 'Is your bag heavy?', a: ['One strap', 'Two straps high', 'Carry in hand'], c: 1 }
        ];

        let currentPos = 0, oldPos = 0, currentScore = 0, isLocked = false, userLives = 2;
        let threeScene, threeCamera, threeRenderer, threeCube, rolling = false, targetRot = { x: 0, y: 0, z: 0 };

        function start3DEngine() {
            threeScene = new THREE.Scene();
            threeCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
            threeRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            const container = document.getElementById('3d-dice-container');
            threeRenderer.setSize(container.offsetWidth, container.offsetHeight);
            container.appendChild(threeRenderer.domElement);

            const createFace = (n) => {
                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = 'white'; ctx.fillRect(0,0,512,512);
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 40; ctx.strokeRect(20,20,472,472);
                ctx.fillStyle = '#3b82f6'; ctx.font = 'bold 300px Fredoka'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(n, 256, 256); 
                const texture = new THREE.CanvasTexture(canvas);
                return new THREE.MeshBasicMaterial({ map: texture });
            };

            const mats = [createFace('3'), createFace('4'), createFace('2'), createFace('5'), createFace('1'), createFace('6')];
            threeCube = new THREE.Mesh(new THREE.BoxGeometry(3,3,3), mats);
            threeScene.add(threeCube); threeCamera.position.z = 8;

            const animate = () => {
                requestAnimationFrame(animate);
                if (rolling) {
                    threeCube.rotation.x += 0.3;
                    threeCube.rotation.y += 0.2;
                } else {
                    threeCube.rotation.x += (targetRot.x - threeCube.rotation.x) * 0.1;
                    threeCube.rotation.y += (targetRot.y - threeCube.rotation.y) * 0.1;
                    threeCube.rotation.z += (targetRot.z - threeCube.rotation.z) * 0.1;
                }
                threeRenderer.render(threeScene, threeCamera);
            };
            animate();
        }

        function buildBoard() {
            const grid = document.getElementById('grid-path');
            for(let i=0; i<18; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile'; tile.id = `square-${i}`;
                tile.innerHTML = i === 0 ? '🏠' : (i === 17 ? '🏆' : '❓');
                grid.appendChild(tile);
            }
            setTimeout(updateRobot, 300);
        }

        function updateRobot() {
            const tile = document.getElementById(`square-${currentPos}`);
            const rect = tile.getBoundingClientRect();
            const arena = document.getElementById('game-container').getBoundingClientRect();
            const bot = document.getElementById('robot-hero');
            bot.style.left = (rect.left - arena.left + rect.width/2 - bot.offsetWidth/2) + 'px';
            bot.style.top = (rect.top - arena.top + rect.height/2 - bot.offsetHeight/2) + 'px';
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('tile-active'));
            tile.classList.add('tile-active');
        }

        async function rollAction() {
            if (isLocked) return; isLocked = true; rolling = true;
            const roll = Math.floor(Math.random() * 6) + 1;
            
            await new Promise(r => setTimeout(r, 1000));
            
            const rots = [
                {x: 0, y: 0, z: 0},               // 1
                {x: -Math.PI/2, y: 0, z: 0},      // 2
                {x: 0, y: -Math.PI/2, z: 0},      // 3
                {x: 0, y: Math.PI/2, z: 0},       // 4
                {x: Math.PI/2, y: 0, z: 0},       // 5
                {x: 0, y: Math.PI, z: 0}          // 6
            ];
            
            const curX = Math.ceil(threeCube.rotation.x / (Math.PI*2)) * (Math.PI*2);
            const curY = Math.ceil(threeCube.rotation.y / (Math.PI*2)) * (Math.PI*2);
            targetRot = { x: curX + rots[roll-1].x, y: curY + rots[roll-1].y, z: rots[roll-1].z };
            rolling = false;

            await new Promise(r => setTimeout(r, 1000));
            
            // SUPER SYNC: Move actor exactly 'roll' times
            for(let i=0; i<roll; i++) {
                if(currentPos < 17) {
                    currentPos++;
                    const bot = document.getElementById('robot-hero');
                    bot.classList.add('jump-animation');
                    updateRobot();
                    await new Promise(r => setTimeout(r, 600));
                    bot.classList.remove('jump-animation');
                }
            }
            resolveMove();
        }

        function resolveMove() {
            if (currentPos >= 17) { renderWin(); return; }
            const q = ERGO_BANK[currentPos % ERGO_BANK.length];
            document.getElementById('modal-content-area').innerHTML = `
                <div class="text-[8vh] mb-4">${q.icon}</div>
                <h2 class="text-[4vh] font-bold text-blue-600 mb-8">${q.q}</h2>
                <div class="flex flex-col gap-4">
                    ${q.a.map((opt, i) => `<button onclick="handleAns(${i}, ${q.c})" class="bg-blue-500 text-white py-4 rounded-2xl text-[3.5vh] font-medium shadow-lg">${opt}</button>`).join('')}
                </div>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
            setTimeout(() => document.getElementById('quest-box').classList.add('active-modal'), 50);
        }

        window.handleAns = (idx, correct) => {
            const modal = document.getElementById('quest-box');
            modal.classList.remove('active-modal');
            setTimeout(() => {
                document.getElementById('modal-overlay').classList.add('hidden');
                if(idx === correct) {
                    currentScore += 20; 
                    isLocked = false;
                } else {
                    userLives--;
                    document.getElementById('heart-display').innerText = "❤️".repeat(userLives);
                    if(userLives <= 0) { renderOver(); return; }
                    currentPos = Math.max(0, currentPos - 1);
                    updateRobot();
                    isLocked = false;
                }
                document.getElementById('score-val').innerText = currentScore;
            }, 500);
        };

        function renderWin() {
            document.getElementById('modal-content-area').innerHTML = `<h2 class="text-[6vh] font-bold text-blue-600">CHAMPION! 🏆</h2><button onclick="location.reload()" class="mt-8 bg-blue-500 text-white px-8 py-4 rounded-xl">REPLAY</button>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('quest-box').classList.add('active-modal');
        }

        function renderOver() {
            document.getElementById('modal-content-area').innerHTML = `<h2 class="text-[6vh] font-bold text-red-500">GAME OVER 🚨</h2><button onclick="location.reload()" class="mt-8 bg-red-500 text-white px-8 py-4 rounded-xl">RESTART</button>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('quest-box').classList.add('active-modal');
        }

        function startGame() { document.getElementById('intro-layer').classList.add('hidden'); }
        window.onload = () => { start3DEngine(); buildBoard(); };
        window.onresize = () => {
            const container = document.getElementById('3d-dice-container');
            threeRenderer.setSize(container.offsetWidth, container.offsetHeight);
            updateRobot();
        };
    </script>
</body>
</html>
