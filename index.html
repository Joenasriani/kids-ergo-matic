<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERGO-MATIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap');
        :root { --primary: rgb(59, 130, 246); --bg-blue: rgb(224, 242, 254); --outer-margin-bg: rgb(191, 219, 254); }
        body { font-family: 'Fredoka', sans-serif; background: var(--outer-margin-bg); touch-action: manipulation; user-select: none; overflow: hidden; height: 100dvh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .app-shell { width: 100%; height: 100%; background: var(--bg-blue); border-radius: 4vmin; display: flex; flex-direction: column; overflow: hidden; position: relative; border: 0.8vmin solid white; }
        header { flex-shrink: 0; height: 15vh; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 5vmin; border-bottom: 0.5vmin solid var(--outer-margin-bg); z-index: 10; }
        main.game-arena { flex: 1; position: relative; background: radial-gradient(rgb(191,219,254) 0.3vmin, transparent 0.3vmin); background-size: 6vmin 6vmin; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .board-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3vmin; width: 100%; max-width: 110vmin; }
        .tile { width: 100%; aspect-ratio: 1; max-width: 12vh; border-radius: 3vmin; display: flex; align-items: center; justify-content: center; background: white; border: 0.6vmin solid rgb(186, 230, 253); font-size: 7vmin; position: relative; }
        .tile-active { border-color: var(--primary); transform: scale(1.1); }
        .tile-finish-glow { background: var(--primary) !important; border-color: white !important; }
        .hero-bot { width: 8vh; height: 8vh; position: absolute; z-index: 100; font-size: 7vh; display: flex; align-items: center; justify-content: center; transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; }
        .jump-animation { animation: robot-hop 0.5s ease; }
        @keyframes robot-hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12vh) scale(1.4); } }
        .control-panel { flex-shrink: 0; height: 25vh; background: rgba(255, 255, 255, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .canvas-dice-area { height: 80%; width: 100%; cursor: pointer; }
        .quest-card-modal { background: white; border-radius: 6vmin; width: 90%; max-width: 95vmin; padding: 6vmin; text-align: center; transform: scale(0.5); opacity: 0; transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .active-modal { transform: scale(1); opacity: 1; }
        .overlay-screen { position: absolute; inset: 0; background: var(--primary); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 5vh; color: white; }
        .action-button { background: rgba(255,255,255,0.2); border: 0.3vmin solid white; font-size: 8vh; padding: 2vh 12vh; border-radius: 4vmin; cursor: pointer; }
        .ui-icon { background: white; border: 0.4vmin solid var(--primary); border-radius: 2vmin; width: 7vh; height: 7vh; display: flex; align-items: center; justify-content: center; font-size: 4vh; cursor: pointer; z-index: 1000; }
    </style>
</head>
<body>

    <div class="app-shell">
        <div id="intro-layer" class="overlay-screen">
            <h1 class="text-[14vh] font-bold uppercase">ERGO-MATIC</h1>
            <div class="bg-white/20 p-[4vh] rounded-[4vmin] text-[3vh] text-left">
                <p>🎲 Roll the Cube to move</p>
                <p>💡 Answer Questions to earn points</p>
                <p>❤️ 2 Lives only!</p>
            </div>
            <button onclick="startGame()" class="action-button">START</button>
        </div>

        <div class="fixed top-[4vmin] right-[4vmin] flex gap-[3vmin] z-[4000]">
            <div onclick="location.reload()" class="ui-icon">🏠</div>
        </div>

        <header>
            <div class="flex items-center gap-[5vmin]">
                <div class="bg-blue-50 px-[3vmin] py-[1vh] rounded-[3vmin] border-[0.4vmin] border-blue-100">
                    <span class="text-[6vh]">💎 <span id="score-val">0</span></span>
                </div>
                <div id="heart-display" class="text-[5vh]">❤️❤️</div>
            </div>
        </header>

        <main class="game-arena" id="game-container">
            <div id="grid-path" class="board-grid"></div>
            <div id="robot-hero" class="hero-bot">🤖</div>
        </main>

        <footer class="control-panel">
            <div id="3d-dice-container" class="canvas-dice-area"></div>
        </footer>

        <div id="modal-overlay" class="fixed inset-0 bg-black/85 hidden z-[6000] flex items-center justify-center">
            <div id="quest-box" class="quest-card-modal">
                <div id="modal-content-area"></div>
            </div>
        </div>
    </div>

    <script>
        const ERGO_BANK = [
            { icon: '🏠', quest: 'Intro', q: 'What is Ergonomics?', a: ['Safe movement and work', 'Building fast robots', 'A vegetable'], c: 0 },
            { icon: '👀', quest: 'Eye Care', q: 'Your eyes are tired. What helps?', a: ['Stare harder', '20-20-20 rule', 'One eye closed'], c: 1 },
            { icon: '🪑', quest: 'Feet', q: 'Feet don\'t touch the floor. Fix?', a: ['Swing legs', 'Use a footrest', 'Sit on knees'], c: 1 },
            { icon: '💻', quest: 'Laptop', q: 'Screen is too low. Fix?', a: ['Lift with books', 'Bend neck', 'Lean forward'], c: 0 },
            { icon: '📱', quest: 'Phone', q: 'Neck hurts from phone. Fix?', a: ['Rest on belly', 'Eye level', 'Look down'], c: 1 },
            { icon: '📦', quest: 'Lifting', q: 'Lift heavy box safely!', a: ['Bend knees', 'Bend back', 'Straight legs'], c: 0 },
            { icon: '🖐️', quest: 'Hands', q: 'How to type?', a: ['Floating/Relaxed', 'Rest on edge', 'Stretched'], c: 0 },
            { icon: '📏', quest: 'Distance', q: 'Monitor distance?', a: ['Arm length', 'Very close', 'Across room'], c: 0 },
            { icon: '🚶', quest: 'Break', q: 'Best thing after 30m sitting?', a: ['Sit more', 'Stand and walk', 'Nap'], c: 1 },
            { icon: '🖥️', quest: 'Screen', q: 'Top of screen should be?', a: ['Knee level', 'Eye level', 'Ceiling'], c: 1 }
        ];

        const FINAL_QUEST = { icon: '🌟', quest: 'Final', q: 'Most important part of ergonomics?', a: ['New chair', 'Moving/Posture', 'Big screen'], c: 1 };

        let currentPos = 0, oldPos = 0, currentScore = 0, isActionLocked = false, userLives = 2, activeLevels = [];
        const robot = document.getElementById('robot-hero'), diceSlot = document.getElementById('3d-dice-container');
        let threeScene, threeCamera, threeRenderer, threeCube, rollingActive = false, diceTargetQuat = new THREE.Quaternion(), diceLerp = 0;

        function start3DEngine() {
            threeScene = new THREE.Scene();
            threeCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
            threeRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            diceSlot.appendChild(threeRenderer.domElement);
            resizeDice();

            const generateFace = (num) => {
                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white'; ctx.fillRect(0,0,512,512);
                ctx.fillStyle = 'rgb(59,130,246)'; ctx.font = 'bold 350px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(num, 256, 256);
                return new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) });
            };

            const mats = [generateFace('3'), generateFace('4'), generateFace('2'), generateFace('5'), generateFace('1'), generateFace('6')];
            threeCube = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.8, 2.8), mats);
            threeScene.add(threeCube); threeCamera.position.z = 7;

            const animate = () => {
                requestAnimationFrame(animate);
                if (rollingActive) { threeCube.rotation.x += 0.4; threeCube.rotation.y += 0.5; }
                else if (diceLerp < 1) { diceLerp += 0.05; threeCube.quaternion.slerp(diceTargetQuat, diceLerp); }
                threeRenderer.render(threeScene, threeCamera);
            };
            animate();
        }

        async function rollAction() {
            if (isActionLocked) return; isActionLocked = true; rollingActive = true;
            const moveSteps = Math.floor(Math.random() * 6) + 1;
            await new Promise(r => setTimeout(r, 1200)); rollingActive = false;

            // ABSOLUTE ROTATION LOCKS: STRAIGHT NUMBERS ONLY
            const calibration = [
                {x: 0, y: 0, z: 0},                  // 1
                {x: -Math.PI/2, y: 0, z: 0},         // 2
                {x: 0, y: -Math.PI/2, z: 0},         // 3
                {x: 0, y: Math.PI/2, z: 0},          // 4
                {x: Math.PI/2, y: 0, z: Math.PI},    // 5 (FLIPPED Z TO BE STRAIGHT)
                {x: 0, y: Math.PI, z: 0}             // 6 (FLIPPED Y TO BE STRAIGHT)
            ];

            const t = calibration[moveSteps-1];
            diceTargetQuat.setFromEuler(new THREE.Euler(t.x, t.y, t.z));
            diceLerp = 0;
            await new Promise(r => setTimeout(r, 1000));

            // SYNCED MOVEMENT: Exactly matches dice face
            for (let i = 0; i < moveSteps; i++) {
                if (currentPos < activeLevels.length - 1) {
                    currentPos++; robot.classList.add('jump-animation'); positionRobot();
                    await new Promise(r => setTimeout(r, 600)); robot.classList.remove('jump-animation');
                }
            }
            resolveLanding();
        }

        function buildGameBoard() {
            const starter = ERGO_BANK[0];
            const pool = ERGO_BANK.slice(1).sort(() => Math.random() - 0.5);
            activeLevels = [starter, ...pool, FINAL_QUEST, { type: 'finish', icon: '🏆' }];
            const grid = document.getElementById('grid-path'); grid.innerHTML = '';
            activeLevels.forEach((node, i) => {
                const sq = document.createElement('div'); sq.className = 'tile';
                sq.id = `square-${i}`; sq.innerHTML = (i === 0) ? '🏠' : node.icon;
                grid.appendChild(sq);
            });
            setTimeout(positionRobot, 300);
        }

        function positionRobot() {
            const dest = document.getElementById(`square-${currentPos}`);
            const rect = dest.getBoundingClientRect();
            const container = document.getElementById('game-container').getBoundingClientRect();
            robot.style.left = (rect.left - container.left + rect.width/2 - robot.offsetWidth/2) + 'px';
            robot.style.top = (rect.top - container.top + rect.height/2 - robot.offsetHeight/2) + 'px';
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('tile-active'));
            dest.classList.add('tile-active');
        }

        function resolveLanding() {
            const node = activeLevels[currentPos];
            if (node.type === 'finish') return renderWin();
            document.getElementById('modal-content-area').innerHTML = `
                <div class="text-[8vh]">${node.icon}</div>
                <div class="text-[4vh] font-bold text-blue-600 my-4">${node.q}</div>
                <div class="flex flex-col gap-4">
                    ${node.a.map((opt, i) => `<button onclick="handleAns(${i}, ${node.c})" class="bg-blue-500 text-white p-4 rounded-xl text-[3vh]">${opt}</button>`).join('')}
                </div>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
            setTimeout(() => document.getElementById('quest-box').classList.add('active-modal'), 50);
        }

        window.handleAns = (pick, correct) => {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('quest-box').classList.remove('active-modal');
            if (pick === correct) { currentScore += 20; isActionLocked = false; }
            else { 
                userLives--; document.getElementById('heart-display').textContent = "❤️".repeat(userLives) || "🖤🖤";
                if (userLives <= 0) location.reload();
                currentPos = oldPos; positionRobot(); isActionLocked = false;
            }
            document.getElementById('score-val').textContent = currentScore;
        };

        function resizeDice() { const size = Math.min(diceSlot.offsetWidth, diceSlot.offsetHeight); threeRenderer.setSize(size, size); }
        function startGame() { document.getElementById('intro-layer').classList.add('hidden'); buildGameBoard(); }
        window.onload = start3DEngine;
        diceSlot.addEventListener('click', rollAction);
    </script>
</body>
</html>
