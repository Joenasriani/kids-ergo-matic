<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ERGO-MATIC</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap');

body {
    font-family: 'Fredoka', sans-serif;
    margin: 0;
    overflow: hidden;
}
</style>
</head>

<body class="bg-sky-100">

<header class="h-[15vh] bg-white flex items-center justify-between px-[5vmin] border-b-[0.5vmin] border-sky-200">
    <h1 class="text-[4vh] font-bold text-blue-500">ERGO-MATIC</h1>
    <div id="3d-dice-container" class="w-[12vh] h-[12vh] cursor-pointer"></div>
</header>

<main id="game-container" class="relative w-full h-[85vh] overflow-hidden"></main>

<div id="modal-overlay" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center">
    <div id="quest-box" class="bg-white rounded-xl p-[4vmin] max-w-[90vw] shadow-2xl"></div>
</div>

<script>
/* =======================
   QUESTION BANK (EDITED)
   ======================= */

const ERGO_BANK = [

/* START — HOUSE ICON */
{
    icon: '🏠',
    quest: 'Start',
    q: 'What is Ergonomics?',
    a: [
        'Setting up your body and tools to stay comfortable and safe',
        'Playing games all day',
        'Ignoring posture'
    ],
    c: 0
},

{
    icon: '💻',
    quest: 'Laptop',
    q: 'Where should your laptop screen be?',
    a: [
        'At eye level',
        'On your lap',
        'Very low on the desk'
    ],
    c: 0
},

/* REPLACED SNACK QUESTION */
{
    icon: '🍎',
    quest: 'Break Time',
    q: 'Where should you eat your snack to protect your body?',
    a: [
        'At a table away from screens',
        'While gaming',
        'Lying down'
    ],
    c: 0
},

{
    icon: '🎒',
    quest: 'Backpack',
    q: 'How should you wear a backpack?',
    a: [
        'With both straps snug',
        'On one shoulder',
        'Very loose'
    ],
    c: 0
},

{
    icon: '📱',
    quest: 'Phone',
    q: 'How should you hold your phone?',
    a: [
        'At eye level',
        'Near your knees',
        'On your stomach'
    ],
    c: 0
},

{
    icon: '🖱️',
    quest: 'Mouse',
    q: 'How should your hand rest on the mouse?',
    a: [
        'Relaxed and straight',
        'Bent sharply',
        'Only using two fingers'
    ],
    c: 0
},

{
    icon: '🪑',
    quest: 'Feet',
    q: 'Your feet don’t touch the floor. What should you do?',
    a: [
        'Use a footrest or box',
        'Swing your legs',
        'Sit on your knees'
    ],
    c: 0
},

{
    icon: '📦',
    quest: 'Lifting',
    q: 'How do you lift something heavy?',
    a: [
        'Bend your knees',
        'Bend your back',
        'Keep legs straight'
    ],
    c: 0
},

/* REPLACED READING QUESTION */
{
    icon: '📖',
    quest: 'Posture',
    q: 'When reading or studying, how should you sit?',
    a: [
        'Upright with back supported',
        'Slouched on the couch',
        'Lying on your stomach'
    ],
    c: 0
},

{
    icon: '👀',
    quest: 'Eyes',
    q: 'What helps protect your eyes?',
    a: [
        'Taking screen breaks',
        'Never blinking',
        'Sitting very close'
    ],
    c: 0
},

/* END — NOT START */
{
    icon: '🌟',
    quest: 'Finish',
    q: 'What is the most important ergonomics habit?',
    a: [
        'Move and change posture often',
        'Get a bigger screen',
        'Sit still longer'
    ],
    c: 0
}
];

/* =======================
   GAME STATE
   ======================= */

let currentPos = 0;
let rolling = false;
let activeLevels = ERGO_BANK;

/* =======================
   THREE.JS DICE (LOCKED)
   ======================= */

let scene, camera, renderer, cube;

function startDice() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.z = 6;

    renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(120, 120);
    document.getElementById('3d-dice-container').appendChild(renderer.domElement);

    const geo = new THREE.BoxGeometry(2.5,2.5,2.5);

    const face = n => {
        const c = document.createElement('canvas');
        c.width = c.height = 512;
        const x = c.getContext('2d');
        x.fillStyle = '#fff';
        x.fillRect(0,0,512,512);
        x.fillStyle = '#000';
        x.font = 'bold 260px Fredoka';
        x.textAlign = 'center';
        x.textBaseline = 'middle';
        x.fillText(n,256,280);
        return new THREE.CanvasTexture(c);
    };

    const mats = [1,2,3,4,5,6].map(n => new THREE.MeshBasicMaterial({ map: face(n) }));
    cube = new THREE.Mesh(geo, mats);
    scene.add(cube);

    animate();
}

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}

/* =======================
   CRUCIAL DICE RULE
   ======================= */

function rollDice() {
    if (rolling) return;
    rolling = true;

    const steps = 3; // LOCKED & SYNCED
    currentPos = (currentPos + steps) % activeLevels.length;

    cube.rotation.set(0,0,0); // ALWAYS UPRIGHT

    setTimeout(() => {
        showQuestion(activeLevels[currentPos]);
        rolling = false;
    }, 400);
}

document.getElementById('3d-dice-container').addEventListener('click', rollDice);

/* =======================
   QUESTIONS
   ======================= */

function showQuestion(data) {
    const box = document.getElementById('quest-box');
    const overlay = document.getElementById('modal-overlay');

    box.innerHTML = `
        <div class="text-center">
            <div class="text-[6vh]">${data.icon}</div>
            <h2 class="text-[3vh] font-bold mt-2">${data.quest}</h2>
            <p class="mt-4 text-[2.2vh]">${data.q}</p>
            <div class="mt-4 space-y-2">
                ${data.a.map((ans,i)=>`
                    <button class="w-full bg-sky-200 rounded-lg p-2" onclick="closeModal()">${ans}</button>
                `).join('')}
            </div>
        </div>
    `;
    overlay.classList.remove('hidden');
}

function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
}

/* ======================= */

startDice();
</script>

</body>
</html>
