<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERGO-MATIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap');

        :root {
            --primary: rgb(59, 130, 246);
            --bg-blue: rgb(224, 242, 254);
            --outer-margin-bg: rgb(191, 219, 254);
            --btn-deep: rgba(255, 255, 255, 0.2); 
            --btn-shadow: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: var(--outer-margin-bg);
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
            height: 100dvh;
            margin: 0;
            padding: 2vmin;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-shell {
            width: 100%;
            height: 100%;
            background: var(--bg-blue);
            border-radius: 4vmin;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4vmin 10vmin -2vmin rgba(0,0,0,0.25);
            border: 0.8vmin solid white;
        }

        header {
            flex-shrink: 0;
            height: 15vh;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5vmin;
            border-bottom: 0.5vmin solid var(--outer-margin-bg);
            z-index: 10;
        }

        main.game-arena {
            flex: 1;
            position: relative;
            background: radial-gradient(rgb(191,219,254) 0.3vmin, transparent 0.3vmin);
            background-size: 6vmin 6vmin;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 2vmin;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 3vmin;
            width: 100%;
            max-width: 110vmin;
            max-height: 100%;
            align-content: center;
            justify-items: center;
        }

        .tile {
            width: 100%;
            aspect-ratio: 1;
            max-width: 12vh;
            max-height: 12vh;
            border-radius: 3vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 0.6vmin solid rgb(186, 230, 253);
            box-shadow: 0 1vmin 0 rgb(186, 230, 253);
            position: relative;
            font-size: 7vmin;
            transition: transform 0.2s;
        }

        .hero-bot {
            width: 10vh;
            height: 10vh;
            position: absolute;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            filter: drop-shadow(0 1vmin 1.5vmin rgba(0,0,0,0.4));
            will-change: left, top;
        }

        .robot-svg {
            width: 100%;
            height: 100%;
        }

        .jump-animation { animation: robot-hop 0.5s ease; }
        @keyframes robot-hop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12vh) scale(1.4); }
        }

        .control-panel {
            flex-shrink: 0;
            height: 25vh;
            background: rgba(255, 255, 255, 0.95);
            border-top: 0.6vmin solid var(--outer-margin-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header>
            <div class="text-2xl font-bold text-blue-600">ERGO-MATIC</div>
            <div class="flex gap-4">
                <div class="bg-blue-50 px-4 py-2 rounded-full border-2 border-blue-200">
                    <span class="text-blue-400 font-bold">POS:</span>
                    <span id="pos-display" class="text-blue-600 font-bold">1</span>
                </div>
            </div>
        </header>

        <main class="game-arena">
            <div id="hero" class="hero-bot">
                <svg class="robot-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2V5M12 5C15.3137 5 18 7.68629 18 11V16C18 19.3137 15.3137 22 12 22C8.68629 22 6 19.3137 6 16V11C6 7.68629 8.68629 5 12 5ZM12 5V2M9 11V12M15 11V12M8 16H16" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="9" cy="11" r="1" fill="#2563eb"/>
                    <circle cx="15" cy="11" r="1" fill="#2563eb"/>
                </svg>
            </div>
            <div class="board-grid" id="board">
                </div>
        </main>

        <div class="control-panel">
            <button onclick="rollDice()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-2xl font-bold text-xl shadow-lg transition-all active:scale-95">
                ROLL DICE
            </button>
        </div>
    </div>

    <script>
        // Game Logic simplified for demo
        const board = document.getElementById('board');
        for (let i = 1; i <= 30; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.innerText = i;
            tile.id = `tile-${i}`;
            board.appendChild(tile);
        }

        function rollDice() {
            const hero = document.getElementById('hero');
            hero.classList.add('jump-animation');
            setTimeout(() => hero.classList.remove('jump-animation'), 500);
        }
    </script>
</body>
</html>
