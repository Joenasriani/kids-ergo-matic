<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERGO-MATIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap');
        :root { --primary: rgb(59, 130, 246); --bg-blue: rgb(224, 242, 254); --outer-margin-bg: rgb(191, 219, 254); }
        body { font-family: 'Fredoka', sans-serif; background: var(--outer-margin-bg); touch-action: manipulation; user-select: none; overflow: hidden; height: 100dvh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .app-shell { width: 96%; height: 96%; background: var(--bg-blue); border-radius: 4vmin; display: flex; flex-direction: column; overflow: hidden; position: relative; border: 0.8vmin solid white; }
        header { height: 12vh; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 4vmin; border-bottom: 0.5vmin solid var(--outer-margin-bg); }
        main.game-arena { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; padding: 2vmin; }
        .board-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2.5vmin; width: 100%; max-width: 100vmin; }
        .tile { aspect-ratio: 1; border-radius: 3vmin; display: flex; align-items: center; justify-content: center; background: white; border: 0.6vmin solid rgb(186, 230, 253); font-size: 6vmin; position: relative; }
        .tile-active { border-color: var(--primary); transform: scale(1.1); z-index: 10; box-shadow: 0 1vmin 0 rgb(37, 99, 235); }
        .hero-bot { width: 8vh; height: 8vh; position: absolute; z-index: 100; font-size: 7vh; display: flex; align-items: center; justify-content: center; transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; }
        .jump-animation { animation: robot-hop 0.5s ease; }
        @keyframes robot-hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10vh) scale(1.2); } }
        .control-panel { height: 22vh; background: white; border-top: 0.6vmin solid var(--outer-margin-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .canvas-dice-area { height: 75%; width: 100%; cursor: pointer; }
        .quest-card-modal { background: white; border-radius: 5vmin; width: 90%; max-width: 80vmin; padding: 5vmin; text-align: center; transform: scale(0.8); opacity: 0; transition: 0.4s; }
        .active-modal { transform: scale(1); opacity: 1; }
    </style>
</head>
<body>
    <div class="app-shell">
        <header>
            <div class="flex gap-4">
                <div class="bg-blue-50 px-4 py-2 rounded-xl border-2 border-blue-100 font-bold text-blue-600 text-2xl">💎 <span id="score-val">0</span></div>
                <div class="bg-red-50 px-4 py-2 rounded-xl border-2 border-red-100 text-2xl" id="heart-display">❤️❤️</div>
            </div>
            <div class="text-3xl font-bold text-blue-500 uppercase">ERGO-MATIC</div>
            <div onclick="location.reload()" class="cursor-pointer text-3xl">🏠</div>
        </header>

        <main class="game-arena" id="game-container">
            <div id="grid-path" class="board-grid"></div>
            <div id="robot-hero" class="hero-bot">🤖</div>
        </main>

        <footer class="control-panel">
            <div id="3d-dice-container" class="canvas-dice-area"></div>
            <p class="font-bold text-blue-500 text-sm tracking-widest">TAP TO ROLL</p>
        </footer>

        <div id="modal-overlay" class="fixed inset-0 bg-black/80 hidden z-[6000] flex items-center justify-center">
            <div id="quest-box" class="quest-card-modal">
                <div id="modal-content-area"></div>
            </div>
        </div>
    </div>

    <script>
        const ERGO_BANK = [
            { icon: '🏠', quest: 'START', q: 'What is Ergonomics?', a: ['Designing the workspace to fit the body', 'A way to build robots', 'Learning to type faster'], c: 0 },
            { icon: '💻', quest: 'MONITOR', q: 'Where should the top of your screen be?', a: ['High above your head', 'At or slightly below eye level', 'Sitting on your lap'], c: 1 },
            { icon: '⌨️', quest: 'KEYBOARD', q: 'What angle should your elbows be while typing?', a: ['Bent at 90 degrees (L shape)', 'Straight out', 'Hands high near face'], c: 0 },
            { icon: '📱', quest: 'PHONE', q: 'How should you look at a phone to save your neck?', a: ['Hold it at eye level', 'Look down at your lap', 'Lay flat on the floor'], c: 0 },
            { icon: '🪑', quest: 'FEET', q: 'What if your feet don\'t reach the floor?', a: ['Swing them', 'Use a box or footrest', 'Cross your legs'], c: 1 },
            { icon: '📦', quest: 'LIFTING', q: 'How do you pick up a heavy box safely?', a: ['Bend your back', 'Keep legs straight', 'Bend your knees'], c: 2 },
            { icon: '🏃', quest: 'EYES', q: 'What is the 20-20-20 rule?', a: ['Look 20ft away every 20m', 'Blink 20 times fast', 'Close eyes for 20m'], c: 0 },
            { icon: '🚶', quest: 'BREAKS', q: 'How often should you stand and move?', a: ['Once a day', 'Every 20-30 minutes', 'Only when finished'], c: 1 }
        ];

        let currentPos = 0, oldPos = 0, currentScore = 0, isActionLocked = false, userLives = 2, activeLevels = [];
        const robot = document.getElementById('robot-hero'), pathGrid = document.getElementById('grid-path');

        let scene, camera, renderer, cube, rolling = false, targetRot = { x: 0, y: 0, z: 0 };

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            const container = document.getElementById('3d-dice-container');
            renderer.setSize(container.offsetWidth, container.offsetHeight);
            container.appendChild(renderer.domElement);

            const loader = new THREE.TextureLoader();
            const createFace = (num) => {
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = 'white'; ctx.fillRect(0,0,256,256);
                ctx.fillStyle = 'rgb(59,130,246)'; ctx.font = 'bold 160px Fredoka'; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(num, 128, 128); return new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) });
            };
            const materials = [createFace('3'), createFace('4'), createFace('2'), createFace('5'), createFace('1'), createFace('6')];
            cube = new THREE.Mesh(new THREE.BoxGeometry(3,3,3), materials);
            scene.add(cube); camera.position.z = 8;

            function animate() {
                requestAnimationFrame(animate);
                if (rolling) { cube.rotation.x += 0.4; cube.rotation.y += 0.5; }
                else {
                    cube.rotation.x += (targetRot.x - cube.rotation.x) * 0.1;
                    cube.rotation.y += (targetRot.y - cube.rotation.y) * 0.1;
                    cube.rotation.z += (targetRot.z - cube.rotation.z) * 0.1;
                }
                renderer.render(scene, camera);
            }
            animate();
        }

        async function roll() {
            if (isActionLocked || rolling) return;
            isActionLocked = true; rolling = true;
            const steps = Math.floor(Math.random() * 6) + 1;
            
            await new Promise(r => setTimeout(r, 1200));
            rolling = false;

            // CRITICAL: STRAIGHT-TO-CAMERA CALIBRATION
            const calibs = [
                {x: 0, y: 0, z: 0},               // 1
                {x: -Math.PI/2, y: 0, z: 0},      // 2
                {x: 0, y: -Math.PI/2, z: 0},      // 3
                {x: 0, y: Math.PI/2, z: 0},       // 4
                {x: Math.PI/2, y: 0, z: Math.PI}, // 5
                {x: 0, y: Math.PI, z: 0}          // 6
            ];
            targetRot = calibs[steps-1];

            await new Promise(r => setTimeout(r, 600));
            for(let i=0; i<steps; i++) {
                if(currentPos < activeLevels.length-1) {
                    currentPos++; robot.classList.add('jump-animation'); moveBot();
                    await new Promise(r => setTimeout(r, 600));
                    robot.classList.remove('jump-animation');
                }
            }
            showQuest();
        }

        function moveBot() {
            const tile = document.getElementById(`sq-${currentPos}`);
            const area = document.getElementById('game-container').getBoundingClientRect();
            const rect = tile.getBoundingClientRect();
            robot.style.left = (rect.left - area.left + rect.width/2 - robot.offsetWidth/2) + 'px';
            robot.style.top = (rect.top - area.top + rect.height/2 - robot.offsetHeight/2) + 'px';
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('tile-active'));
            tile.classList.add('tile-active');
        }

        function showQuest() {
            const data = activeLevels[currentPos];
            if (!data.q) return win();
            document.getElementById('modal-content-area').innerHTML = `
                <div class="text-6xl mb-4">${data.icon}</div>
                <div class="text-xl font-bold text-blue-500 mb-2">${data.quest}</div>
                <div class="text-2xl font-bold mb-6">${data.q}</div>
                <div class="flex flex-col gap-3">
                    ${data.a.map((opt, i) => `<button onclick="check(${i},${data.c})" class="bg-blue-500 text-white p-4 rounded-2xl font-bold text-xl">${opt}</button>`).join('')}
                </div>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
            setTimeout(() => document.getElementById('quest-box').classList.add('active-modal'), 10);
        }

        window.check = (idx, correct) => {
            document.getElementById('quest-box').classList.remove('active-modal');
            setTimeout(() => {
                document.getElementById('modal-overlay').classList.add('hidden');
                if(idx === correct) { currentScore += 20; isActionLocked = false; }
                else { 
                    userLives--; 
                    document.getElementById('heart-display').textContent = "❤️".repeat(userLives) || "🖤🖤";
                    if(userLives <= 0) return alert('GAME OVER') || location.reload();
                    currentPos = oldPos; moveBot(); isActionLocked = false;
                }
                document.getElementById('score-val').textContent = currentScore;
                oldPos = currentPos;
            }, 400);
        };

        function win() { alert('YOU ARE AN ERGO CHAMPION!'); location.reload(); }

        window.onload = () => {
            init3D();
            activeLevels = [...ERGO_BANK, { icon: '🏆', quest: 'FINISH', q: '', a: [], c: 0 }];
            activeLevels.forEach((n, i) => {
                const d = document.createElement('div'); d.className='tile'; d.id=`sq-${i}`; d.innerHTML=n.icon; pathGrid.appendChild(d);
            });
            setTimeout(moveBot, 200);
            document.getElementById('3d-dice-container').addEventListener('click', roll);
        };
    </script>
</body>
</html>
