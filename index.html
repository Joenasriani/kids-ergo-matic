<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERGO-MATIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap');
        :root { --primary: rgb(59, 130, 246); --bg-blue: rgb(224, 242, 254); --outer-margin-bg: rgb(191, 219, 254); }
        body { font-family: 'Fredoka', sans-serif; background: var(--outer-margin-bg); touch-action: manipulation; user-select: none; overflow: hidden; height: 100dvh; margin: 0; padding: 2vmin; display: flex; justify-content: center; align-items: center; }
        .app-shell { width: 100%; height: 100%; background: var(--bg-blue); border-radius: 4vmin; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 4vmin 10vmin -2vmin rgba(0,0,0,0.25); border: 0.8vmin solid white; }
        header { flex-shrink: 0; height: 15vh; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 5vmin; border-bottom: 0.5vmin solid var(--outer-margin-bg); z-index: 10; }
        main.game-arena { flex: 1; position: relative; background: radial-gradient(rgb(191,219,254) 0.3vmin, transparent 0.3vmin); background-size: 6vmin 6vmin; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 2vmin; }
        .board-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3vmin; width: 100%; max-width: 110vmin; align-content: center; justify-items: center; }
        .tile { width: 100%; aspect-ratio: 1; max-width: 12vh; max-height: 12vh; border-radius: 3vmin; display: flex; align-items: center; justify-content: center; background: white; border: 0.6vmin solid rgb(186, 230, 253); box-shadow: 0 1vmin 0 rgb(186, 230, 253); font-size: 7vmin; position: relative; }
        .tile-active { border-color: var(--primary); box-shadow: 0 1vmin 0 rgb(37, 99, 235); transform: scale(1.1); }
        .hero-bot { width: 8vh; height: 8vh; position: absolute; z-index: 100; font-size: 7vh; display: flex; align-items: center; justify-content: center; transition: left 0.5s ease, top 0.5s ease; pointer-events: none; filter: drop-shadow(0 1vmin 1.5vmin rgba(0,0,0,0.4)); }
        .jump-animation { animation: robot-hop 0.5s ease; }
        @keyframes robot-hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10vh) scale(1.2); } }
        .control-panel { flex-shrink: 0; height: 25vh; background: white; border-top: 0.6vmin solid var(--outer-margin-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .canvas-dice-area { height: 80%; width: 100%; cursor: pointer; }
        .overlay-screen { position: absolute; inset: 0; background: var(--primary); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; color: white; }
        .quest-card-modal { background: white; border-radius: 6vmin; width: 90%; max-width: 95vmin; padding: 6vmin; text-align: center; display: none; z-index: 6000; position: absolute; box-shadow: 0 4vh 10vh rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="app-shell">
        <div id="intro-layer" class="overlay-screen">
            <h1 class="text-[10vh] font-bold">ERGO-MATIC</h1>
            <button onclick="startGame()" class="bg-white text-blue-500 px-12 py-6 rounded-3xl text-[5vh] font-bold shadow-xl">START</button>
        </div>
        <header>
            <div class="flex items-center gap-4 bg-blue-50 px-6 py-2 rounded-2xl border-4 border-blue-100">
                <span class="text-[5vh]">💎</span><span id="score-val" class="text-[5vh] font-bold text-blue-600">0</span>
            </div>
            <div id="heart-display" class="text-[5vh]">❤️❤️</div>
        </header>
        <main class="game-arena" id="game-container">
            <div id="grid-path" class="board-grid"></div>
            <div id="robot-hero" class="hero-bot">🤖</div>
        </main>
        <footer class="control-panel" onclick="rollAction()">
            <div id="3d-dice-container" class="canvas-dice-area"></div>
            <p class="font-bold text-blue-500 uppercase">Tap to Roll</p>
        </footer>
        <div id="modal-overlay" class="fixed inset-0 bg-black/80 hidden z-[5500] items-center justify-center flex">
            <div id="quest-box" class="quest-card-modal">
                <div id="modal-content-area"></div>
            </div>
        </div>
    </div>

    <script>
        const ERGO_BANK = [
            { icon: '🏠', q: 'What is Ergonomics?', a: ['Plant growth', 'Fitting task to person', 'Racing cars'], c: 1 },
            { icon: '💻', q: 'Where should the screen top be?', a: ['Eye level', 'Below chin', 'Ceiling'], c: 0 },
            { icon: '⌨️', q: 'Wrist position for typing?', a: ['Bent up', 'Bent down', 'Straight'], c: 2 },
            { icon: '📏', q: 'Monitor distance?', a: ['Arm length', 'Close', 'Far'], c: 0 },
            { icon: '📐', q: 'Elbow angle?', a: ['Straight', '90 degrees', 'Fully bent'], c: 1 }
        ];

        let currentPos = 0, oldPos = 0, currentScore = 0, userLives = 2, isLocked = false;
        let threeScene, threeCamera, threeRenderer, threeCube, rolling = false, targetRot = {x:0, y:0, z:0};

        function start3DEngine() {
            threeScene = new THREE.Scene();
            threeCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
            threeRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            const container = document.getElementById('3d-dice-container');
            threeRenderer.setSize(container.offsetWidth, container.offsetHeight);
            container.appendChild(threeRenderer.domElement);

            const loader = new THREE.TextureLoader();
            const createFace = (n) => {
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = 'white'; ctx.fillRect(0,0,256,256);
                ctx.fillStyle = '#3b82f6'; ctx.font = 'bold 160px Fredoka'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(n, 128, 128); return new THREE.CanvasTexture(canvas);
            };
            const mats = [createFace('3'), createFace('4'), createFace('2'), createFace('5'), createFace('1'), createFace('6')].map(t => new THREE.MeshBasicMaterial({map: t}));
            threeCube = new THREE.Mesh(new THREE.BoxGeometry(3,3,3), mats);
            threeScene.add(threeCube); threeCamera.position.z = 8;

            const animate = () => {
                requestAnimationFrame(animate);
                if (rolling) { threeCube.rotation.x += 0.3; threeCube.rotation.y += 0.2; }
                else {
                    threeCube.rotation.x += (targetRot.x - threeCube.rotation.x) * 0.1;
                    threeCube.rotation.y += (targetRot.y - threeCube.rotation.y) * 0.1;
                    threeCube.rotation.z += (targetRot.z - threeCube.rotation.z) * 0.1;
                }
                threeRenderer.render(threeScene, threeCamera);
            };
            animate();
        }

        function buildBoard() {
            const grid = document.getElementById('grid-path');
            for(let i=0; i<18; i++) {
                const tile = document.createElement('div'); tile.className = 'tile';
                tile.id = `square-${i}`; tile.innerHTML = i === 0 ? '🏠' : (i === 17 ? '🏆' : '❓');
                grid.appendChild(tile);
            }
            setTimeout(updateRobot, 200);
        }

        function updateRobot() {
            const tile = document.getElementById(`square-${currentPos}`);
            const rect = tile.getBoundingClientRect();
            const arena = document.getElementById('game-container').getBoundingClientRect();
            const bot = document.getElementById('robot-hero');
            bot.style.left = (rect.left - arena.left + rect.width/2 - bot.offsetWidth/2) + 'px';
            bot.style.top = (rect.top - arena.top + rect.height/2 - bot.offsetHeight/2) + 'px';
        }

        async function rollAction() {
            if (isLocked) return; isLocked = true; rolling = true;
            const roll = Math.floor(Math.random() * 6) + 1;
            await new Promise(r => setTimeout(r, 800));
            
            const rots = [
                {x: 0, y: 0, z: 0},            // 1
                {x: -Math.PI/2, y: 0, z: 0},   // 2
                {x: 0, y: -Math.PI/2, z: 0},   // 3
                {x: 0, y: Math.PI/2, z: 0},    // 4
                {x: Math.PI/2, y: 0, z: 0},    // 5
                {x: 0, y: Math.PI, z: 0}       // 6
            ];
            
            const curX = Math.ceil(threeCube.rotation.x / (Math.PI*2)) * (Math.PI*2);
            const curY = Math.ceil(threeCube.rotation.y / (Math.PI*2)) * (Math.PI*2);
            targetRot = { x: curX + rots[roll-1].x, y: curY + rots[roll-1].y, z: rots[roll-1].z };
            rolling = false;

            await new Promise(r => setTimeout(r, 1000));
            
            for(let i=0; i<roll; i++) {
                if(currentPos < 17) {
                    currentPos++;
                    document.getElementById('robot-hero').classList.add('jump-animation');
                    updateRobot();
                    await new Promise(r => setTimeout(r, 500));
                    document.getElementById('robot-hero').classList.remove('jump-animation');
                }
            }
            showQuest();
        }

        function showQuest() {
            if (currentPos >= 17) { alert("Winner!"); location.reload(); return; }
            const q = ERGO_BANK[currentPos % ERGO_BANK.length];
            document.getElementById('modal-content-area').innerHTML = `
                <h2 class="text-[4vh] font-bold text-blue-600 mb-6">${q.q}</h2>
                <div class="flex flex-col gap-4">
                    ${q.a.map((opt, i) => `<button onclick="checkAns(${i}, ${q.c})" class="bg-blue-500 text-white p-4 rounded-xl text-[3vh]">${opt}</button>`).join('')}
                </div>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('quest-box').style.display = 'block';
        }

        window.checkAns = (idx, correct) => {
            document.getElementById('modal-overlay').style.display = 'none';
            if(idx === correct) { currentScore += 20; isLocked = false; }
            else { userLives--; currentPos = Math.max(0, currentPos - 2); updateRobot(); isLocked = false; }
            document.getElementById('score-val').innerText = currentScore;
            document.getElementById('heart-display').innerText = "❤️".repeat(userLives);
            if(userLives <= 0) { alert("Game Over"); location.reload(); }
        };

        function startGame() { document.getElementById('intro-layer').style.display = 'none'; }
        window.onload = () => { start3DEngine(); buildBoard(); };
    </script>
</body>
</html>
